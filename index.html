<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HSK 방학 특강 · 모의고사</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%232B7A67%22/%3E%3Ctext x=%2232%22 y=%2245%22 font-size=%2236%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22serif%22%3E汉%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --paper:#F3F6F4; --surface:#FFFFFF; --ink:#18211E; --muted:#5A6863; --line:#D6DFDA;
  --jade:#2B7A67; --jade-ink:#FFFFFF; --jade-soft:#E1EFEA; --seal:#B23A2C; --seal-soft:#F7E4E1;
  --warn:#9A6210; --warn-soft:#F6ECD9; --ok:#2B7A67; --ok-soft:#E1EFEA;
  --f-zh:"Noto Sans SC","IBM Plex Sans KR",sans-serif; --f-zh-d:"Noto Serif SC",serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace; --r:12px; --zh:18px;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#111715; --surface:#19211E; --ink:#E4EBE8; --muted:#97A59F; --line:#2C3833;
  --jade:#5FB59E; --jade-ink:#0E1513; --jade-soft:#1D3530; --seal:#E07A6C; --seal-soft:#3A2220; --warn:#E0B060; --warn-soft:#332A19; --ok:#5FB59E; --ok-soft:#1D3530;
}}
body[data-size="l"]{--zh:22px} body[data-size="xl"]{--zh:27px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.zh{font-family:var(--f-zh);font-size:var(--zh);line-height:1.85}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 120px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--jade)}
.btn.pri{background:var(--jade);color:var(--jade-ink);border-color:var(--jade)}
.btn.seal{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--jade-soft);color:var(--jade)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.seal{background:var(--seal-soft);color:var(--seal)}
.mono{font-family:var(--f-num)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
h1{font-size:24px;margin:8px 0 4px;letter-spacing:-.02em} h2{font-size:19px;margin:0 0 6px} h3{font-size:16px;margin:0 0 4px}
/* login */
.login{max-width:420px;margin:12vh auto 0}
.login label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=password],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
/* home */
.levels{display:flex;gap:8px;margin:18px 0 12px}
.levels button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;font-weight:700;font-size:16px}
.levels button[aria-pressed=true]{background:var(--jade);color:var(--jade-ink);border-color:var(--jade)}
.corners{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 8px}.corners button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px}.corners button b{display:block;font-size:16px}.corners button span{font-size:12.5px;color:var(--muted)}.corners button[aria-selected=true]{border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade);background:var(--jade-soft)}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.set h2{display:flex;align-items:center;gap:8px}
.set .meta{font-size:13px;color:var(--muted);margin-bottom:12px}
.set .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.last{font-size:13px;margin-top:8px}
/* test */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0 2px}
.tabs button{border:none;background:none;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs .cnt{font-family:var(--f-num);font-size:12px;margin-left:4px}
.part{margin:22px 0 10px}
.part > h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.part .ins{font-size:13.5px;color:var(--muted);margin-bottom:10px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0}
.q.right{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)} .q.wrong{border-color:var(--seal);box-shadow:inset 4px 0 0 var(--seal)}
.qn{font-family:var(--f-num);font-weight:500;color:var(--jade);margin-right:8px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0}
.grp > .q{border-style:dashed;margin:10px 0 0}
.passage{white-space:pre-wrap;background:color-mix(in srgb,var(--jade-soft) 40%,var(--surface));border-radius:10px;padding:12px 14px;margin:6px 0 10px}
audio{width:100%;height:38px;margin:4px 0 8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:6px}
.opts.col{grid-template-columns:1fr}
.opts.wide{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.opts.wide .zh{white-space:nowrap}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.opt b{font-family:var(--f-num);color:var(--muted);min-width:1.2em}
.opt:hover{border-color:var(--jade)}
.opt.sel{border-color:var(--jade);background:var(--jade-soft)} .opt.sel b{color:var(--jade)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.bad{border-color:var(--seal);background:var(--seal-soft)}
.tfopts{display:flex;gap:10px;margin-top:8px}.tfopts .opt{min-width:84px;justify-content:center;font-size:20px;font-weight:700}
.letters{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.letters .opt{min-width:44px;justify-content:center;font-family:var(--f-num);font-weight:600;padding:7px 10px}
.bank{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;margin-bottom:8px}
.bank span b{font-family:var(--f-num);color:var(--jade);margin-right:4px}
.blank{display:inline-block;min-width:3.2em;text-align:center;border-bottom:2px solid var(--jade);color:var(--jade);font-weight:600;padding:0 4px}
.seg{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.opt[disabled]{opacity:.45;cursor:default}.opt.ok[disabled],.opt.sel[disabled]{opacity:1}
.built{min-height:44px;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words .opt{padding:6px 12px}
.fbk{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--paper);font-size:14px}
.fbk .ans{font-weight:700}
.script{white-space:pre-wrap;font-size:calc(var(--zh)*.85)}
details summary{cursor:pointer;color:var(--jade);font-weight:600;font-size:14px;margin-top:6px}
textarea{width:100%;min-height:150px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-family:var(--f-zh);font-size:var(--zh);line-height:1.8;resize:vertical}
.counter{font-family:var(--f-num);font-size:13px;color:var(--muted);text-align:right}
.scene{display:flex;gap:14px;align-items:center;background:var(--warn-soft);border-radius:10px;padding:12px 14px;margin:8px 0}
.scene .emo{font-size:40px;line-height:1}
.word-tag{display:inline-block;font-family:var(--f-zh-d);font-size:calc(var(--zh)*1.3);font-weight:700;color:var(--seal);border:2px solid var(--seal);border-radius:8px;padding:0 12px;margin:4px 0}
.rec{display:inline-flex;align-items:center;gap:8px}
.rec.on{background:var(--seal);color:#fff;border-color:var(--seal);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--seal) 25%,transparent)}}
.live{min-height:2em;margin:8px 0;padding:8px 12px;border-radius:10px;background:var(--paper)}
.diff .m{color:var(--ok)} .diff .x{color:var(--seal);text-decoration:underline wavy;text-underline-offset:4px}
.score-big{font-size:42px;font-weight:700;font-family:var(--f-num);line-height:1}
.ai{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;background:var(--surface)}
.ai h4{margin:10px 0 4px;font-size:14px}
.ai ul{margin:4px 0;padding-left:20px}
.ai table{width:100%;border-collapse:collapse;font-size:14px}
.ai td,.ai th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.ai .zh{font-size:calc(var(--zh)*.85)}
.result{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.result .card{padding:14px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--jade)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line)}
.foot .in{max-width:860px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.prog{flex:1;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:50;font-size:14px;max-width:90vw}
table.dash{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface)}
table.dash th,table.dash td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
table.dash th{font-size:12px;color:var(--muted)}
.teacher-ans{margin-top:8px}

.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.step.cur{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)} .step.done .num{background:var(--jade);color:var(--jade-ink)}
.step .sh{display:flex;gap:8px;align-items:center;margin-bottom:2px}.step .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:99px;background:var(--line);font-size:12px;font-weight:700}
.hwrow{display:flex;gap:6px;align-items:center;justify-content:space-between;margin:4px 0;font-size:14px}.hwrow .btn,.hwrow .chip{white-space:nowrap}.hwrow>span:first-child{flex:1}
.now{border-color:var(--warn);background:var(--warn-soft);margin:10px 0}
.nbbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nbbar select{width:auto;min-width:220px}
.seg3{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg3 button{border:none;background:var(--surface);padding:7px 12px;font-size:13px;font-weight:600}.seg3 button[aria-pressed=true]{background:var(--jade);color:var(--jade-ink)}
.nbh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.srow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px 12px;margin:5px 0}
.srow b{font-family:var(--f-num);color:var(--muted);min-width:1.2em}.srow .zh{flex:1}
.srow.ok{border-color:var(--ok);background:var(--ok-soft)}.srow.bad{border-color:var(--seal);background:var(--seal-soft)}
.dist{display:inline-block;width:140px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}.dist i{display:block;height:100%;background:var(--jade)}
.srow.bad .dist i,.srow:not(.ok) .dist i{background:var(--seal)} .srow.ok .dist i{background:var(--ok)}
label.chk{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;background:var(--surface)}
.lec{max-width:1100px;margin:0 auto;padding:14px 18px 30px}
.lecbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.lecbody{min-height:55vh}
.lecctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;position:sticky;bottom:0;background:var(--paper);padding:10px 0}
input[type=date]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
@media print{.noprint,button,audio,.lecctl{display:none!important}.q{break-inside:avoid}body{background:#fff}}
@media (max-width:560px){.opts{grid-template-columns:1fr 1fr}.wrap{padding:12px 12px 120px}}
@media print{header.top,.foot{display:none}}
</style>

<div id="app"></div>
<script src="config.js"></script>
<script src="data/hsk4a.js"></script>
<script src="data/hsk4b.js"></script>
<script src="data/hsk5a.js"></script>
<script src="data/hsk5b.js"></script>
<script src="data/hsk6a.js"></script>
<script src="data/hsk6b.js"></script>
<script src="data/practice/p4a.js"></script>
<script src="data/practice/p4b.js"></script>
<script src="data/practice/p5a.js"></script>
<script src="data/practice/p5b.js"></script>
<script src="data/practice/p6a.js"></script>
<script src="data/practice/p6b.js"></script>
<script>
'use strict';
const CFG = window.APP_CONFIG || {};
const SETS = window.HSK_SETS || [];
const app = document.getElementById('app');
const qs = new URLSearchParams(location.search);
const TEACHER = qs.has('teacher');
// 정답·해설·스크립트 미리 보기는 교사 PIN이 서버에서 확인된 뒤에만 켜집니다 (?teacher=1만으로는 안 보임).
const tOK = () => TEACHER && sessionStorage.getItem('hsk_pin_ok') === '1';
const OBJ = new Set(['tf','lmc','lgroup','bank','order','rmc','rgroup','cloze','error','multi','sentfill','arrange']);
const LETTERS = ['A','B','C','D','E','F'];
const SEC_KO = {L:'듣기',R:'독해',W:'쓰기',S:'말하기'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const norm = s => String(s||'').replace(/[\s。，、？！,.?!：:；;“”"‘’'（）()《》…—-]/g,'');
const hanzi = s => (String(s||'').match(/[㐀-鿿]/g) || []).join('');
const countChars = s => String(s||'').replace(/\s/g,'').length;
const fmtTime = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }

// ── data helpers ──
function getSet(id){ return SETS.find(s => s.id === id); }
function flatten(set){
  const out = [];
  for(const sec of set.sections) for(const part of sec.parts){
    if(part.groups) for(const g of part.groups) for(const item of g.items) out.push({sec, part, group:g, item, obj:OBJ.has(part.type)});
    else for(const item of part.items) out.push({sec, part, group:null, item, obj:OBJ.has(part.type)});
  }
  return out;
}
function isCorrect(e, resp){
  if(resp == null || resp === '') return false;
  if(e.part.type === 'arrange') return e.item.ans.some(a => norm(a) === norm(resp));
  return resp === e.item.ans;
}
function correctText(e){
  const it = e.item, t = e.part.type;
  if(t === 'arrange') return it.ans[0];
  if(t === 'tf') return it.ans;
  if(t === 'order') return it.ans.split('').join(' → ');
  if(t === 'bank') return `${it.ans} ${e.part.bank[it.ans]}`;
  if(t === 'sentfill') return `${it.ans} ${e.group.bank[it.ans]}`;
  return `${it.ans}  ${(it.opts||[])[LETTERS.indexOf(it.ans)] || ''}`;
}
function itemNo(id){ return id.replace(/\D/g,''); }

// ── state ──
let S = { view:'login', user: LS.get('hsk_user', null), level: LS.get('hsk_level', 4) };
const wrongKey = (sid, set) => `hsk_wrong_${sid}_${set}`;
const histKey = sid => `hsk_hist_${sid}`;
const draftKey = (sid, set) => `hsk_draft_${sid}_${set}`;
let tick = null;

// ── server ──
async function api(payload){
  if(!CFG.SCRIPT_URL) return null;
  const r = await fetch(CFG.SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
  return r.json();
}
async function apiGet(params){
  if(!CFG.SCRIPT_URL) return null;
  const r = await fetch(CFG.SCRIPT_URL + '?' + new URLSearchParams(params));
  return r.json();
}
async function hashPw(name, pw){
  const txt = 'hsk-camp|' + name + '|' + pw;
  try{ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h = 5381; for(const c of txt) h = (h*33 + c.charCodeAt(0)) >>> 0; return 'x' + h.toString(16); }
}
const progKey = (sid, set) => `hsk_prog_${sid}_${set}`;
async function syncProgress(){
  if(!CFG.SCRIPT_URL || !S.user || !S.user.h) return;
  try{
    const r = await api({action:'loadProgress', name:S.user.name, hash:S.user.h});
    if(r && r.ok && Array.isArray(r.history)){
      const hist = LS.get(histKey(S.user.sid), []);
      for(const h of r.history){
        const at = new Date(String(h.at).replace(' ', 'T') + '+09:00').getTime();
        if(!hist.some(x => x.set === h.set && x.c === h.c && Math.abs(x.at - at) < 120000)) hist.push({set:h.set, mode:h.mode, scope:h.scope, c:+h.c, t:+h.t, at});
      }
      hist.sort((a,b) => a.at - b.at); LS.set(histKey(S.user.sid), hist.slice(-200));
    }
    if(r && r.ok && r.progress){
      for(const set of SETS.filter(x => x.corner === 'exam')){
        const srv = r.progress[set.id], loc = LS.get(progKey(S.user.sid, set.id), null);
        if(srv && (!loc || (srv.savedAt||0) > (loc.savedAt||0))) LS.set(progKey(S.user.sid, set.id), srv);
        if(!srv && loc && loc.savedAt){
          const hist = LS.get(histKey(S.user.sid), []);
          // finished on another device after this save → drop the stale local copy instead of re-uploading it
          if(hist.some(h => h.set === set.id && h.mode === 'exam' && h.at > loc.savedAt)) LS.set(progKey(S.user.sid, set.id), null);
          else pushProgress(set.id, loc, true);
        }
      }
      if(S.view === 'home') render();
    }
  }catch(e){}
}
let pushTimer = null;
function pushProgress(setId, data, now){
  if(!CFG.SCRIPT_URL || !S.user?.h) return;
  clearTimeout(pushTimer);
  const go = () => api({action:'saveProgress', name:S.user.name, hash:S.user.h, setId, pct:data.pct||0, data}).then(r => { const el = document.getElementById('saved'); if(el && r && r.ok) el.textContent = '☁️ 저장됨 ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); }).catch(()=>{});
  if(now) go(); else pushTimer = setTimeout(go, 4000);
}
function persist(now){
  if(S.view !== 'test' || S.mode !== 'exam' || S.submitted) return;
  const sub = {}; for(const k in S.sub){ const {fbHTML, diffHTML, ...rest} = S.sub[k]; sub[k] = rest; }
  const obj = S.entries.filter(e=>e.obj), done = obj.filter(e => S.ans[e.item.id] != null && S.ans[e.item.id] !== '').length;
  const data = {v:1, ans:S.ans, sub, elapsed:Math.round((Date.now()-S.t0)/1000), tab:S.tab, savedAt:Date.now(), pct: Math.round(done/Math.max(1,obj.length)*100)};
  LS.set(progKey(S.user.sid, S.set.id), data);
  const el = document.getElementById('saved'); if(el) el.textContent = '💾 이 기기에 저장됨';
  pushProgress(S.set.id, data, now);
}

function setStats(set){
  const f = flatten(set), c = {};
  for(const e of f) c[e.sec.key] = (c[e.sec.key]||0) + 1;

}
// 급수 잠금: 4급부터. 한 급수의 실전 모의고사(1·2회)를 모두 제출해야 다음 급수가 열립니다. 교수자 모드는 모두 열림.
function levelDone(l){
  const hist = LS.get(histKey(S.user.sid), []), hw = SETS.filter(s => s.level === l && s.corner === 'exam');
  return hw.length > 0 && hw.every(s => hist.some(h => h.set === s.id && h.mode === 'exam'));
}
function unlockedLevels(){
  if(TEACHER) return [4,5,6];

  for(const l of [4,5]){ if(levelDone(l) && entered(l + 1)) out.push(l + 1); else break; }
  return out;
}

function entered(l){
  if(LS.get(`hsk_go_${S.user.sid}_${l}`, false)) return true;

    <div class="row"><button class="btn sm ${wrong.length?'seal':''}" data-act="start" data-set="${set.id}" data-scope="retry" ${wrong.length?'':'disabled'}>오답 다시 풀기 (${wrong.length})</button></div>

function examCard(set, hist){
  const st = setStats(set), wrong = LS.get(wrongKey(S.user.sid,set.id), []);
  const prog = LS.get(progKey(S.user.sid, set.id), null);
  const done = hist.filter(h => h.set === set.id && h.mode === 'exam');
  const best = done.length ? Math.max(...done.map(h => Math.round(h.c/Math.max(1,h.t)*100))) : null;
  const total = Object.values(set.minutes||{}).reduce((a,b)=>a+b,0);
  const left = prog ? Math.max(0, total*60 - (prog.elapsed||0)) : 0;
  return `<div class="card set">
    <h2>${esc(set.title)} ${prog?'<span class="chip warn">진행 중</span>':''}</h2>
    <div class="meta">${Object.entries(st).map(([k,v])=>`${SEC_KO[k]} ${v}`).join(' · ')} · 약 ${total}분</div>
    ${prog ? `<div class="bar" style="margin-bottom:6px"><i style="width:${prog.pct||0}%"></i></div><div class="muted" style="font-size:13px;margin-bottom:10px">객관식 ${prog.pct||0}% 완료 · 남은 시간 약 ${Math.ceil(left/60)}분 · ${new Date(prog.savedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} 저장</div>
      <button class="btn pri" data-act="exam" data-set="${set.id}" data-v="resume">이어서 풀기</button> <button class="btn sm ghost" data-act="exam" data-set="${set.id}" data-v="new">처음부터</button>`
      : `<button class="btn pri" data-act="exam" data-set="${set.id}" data-v="new">${done.length?'다시 응시하기':'시험 시작'}</button>`}
    <div class="row"><button class="btn sm ${wrong.length?'seal':''}" data-act="start" data-set="${set.id}" data-scope="retry" ${wrong.length?'':'disabled'}>오답 다시 풀기 (${wrong.length})</button></div>
    ${done.length?`<div class="last muted">응시 ${done.length}회 · 최고 ${best}% · 최근 ${done.slice(-1)[0].c}/${done.slice(-1)[0].t} (${new Date(done.slice(-1)[0].at).toLocaleDateString('ko-KR')})</div>`:''}
  </div>`;
}

// ── test ──
function startTest(setId, scope, resume){
  const set = getSet(setId);
  if(scope === 'exam'){
    const prog = resume ? LS.get(progKey(S.user.sid, setId), null) : null;
    if(!resume) LS.set(progKey(S.user.sid, setId), null);
    const entries = flatten(set);
    const sub = prog?.sub || {};
    for(const k in sub) if(sub[k].phase === 'read') sub[k].phase = 'write';
    S = {...S, view:'test', mode:'exam', set, scope:'exam', entries, ids:new Set(entries.map(e=>e.item.id)), ans: prog?.ans || {}, sub,
         submitted:false, t0: Date.now() - (prog?.elapsed||0)*1000, tab: prog?.tab || entries[0].sec.key, result:null, retryCount:0, limit: Object.values(set.minutes||{}).reduce((a,b)=>a+b,0)*60};
    render(); if(prog) toast('저장된 곳부터 이어서 풉니다.'); else persist(true);
    return;
  }
  const draft = LS.get(draftKey(S.user.sid, setId), {});
  let filter = null;
  if(scope === 'retry') filter = new Set(LS.get(wrongKey(S.user.sid, setId), []));
  const entries = flatten(set).filter(e => scope === 'all' ? true : scope === 'retry' ? (e.obj && filter.has(e.item.id)) : e.sec.key === scope);
  const sub = draft.sub || {};
  for(const k in sub) if(sub[k].phase === 'read') sub[k].phase = 'write';
  S = {...S, view:'test', mode:'practice', set, scope, entries, ids:new Set(entries.map(e=>e.item.id)), ans:{}, sub, submitted:false, t0:Date.now(), tab:null, result:null, retryCount:0};
  S.tab = entries[0]?.sec.key;
  render();
}
function saveDraft(){ LS.set(draftKey(S.user.sid, S.set.id), {sub: S.sub}); }
function inScope(item){ return S.ids.has(item.id); }

function viewTest(){
  const secs = S.set.sections.filter(sec => S.entries.some(e => e.sec === sec));
  const objTotal = S.entries.filter(e => e.obj).length;
  const modeLabel = S.mode==='exam' ? '실전 모의고사' : S.scope==='retry' ? '오답 다시 풀기' : S.scope==='all' ? '전체' : SEC_KO[S.scope];
  app.innerHTML = topbar(`<span class="chip">${esc(modeLabel)}</span>${tOK()?'<span class="chip warn">교사 모드</span>':''}<span class="mono muted" id="clock">00:00</span>${S.mode==='exam'&&!S.submitted?'<span class="muted" id="saved" style="font-size:12px"></span><button class="btn sm" data-act="saveexit">저장하고 나가기</button>':'<button class="btn sm" data-act="home">나가기</button>'}`) + `
  <div class="wrap">
    <h1>${esc(S.set.title)}</h1>
    ${S.result ? resultHTML() : ''}
    <div class="tabs" role="tablist">${secs.map(sec=>{ const n=S.entries.filter(e=>e.sec===sec).length; return `<button role="tab" data-act="tab" data-v="${sec.key}" aria-selected="${S.tab===sec.key}">${sec.name} ${SEC_KO[sec.key]}<span class="cnt">${n}</span></button>`;}).join('')}</div>
    ${secs.map(sec => `<section data-sec="${sec.key}" ${S.tab===sec.key?'':'hidden'}>${sec.parts.map(partHTML).join('')}</section>`).join('')}
  </div>
  <div class="foot"><div class="in">
    <div class="prog" id="prog"></div>
    ${S.submitted ? `<button class="btn" data-act="home">목록으로</button>${S.retryCount?`<button class="btn seal" data-act="retrynow">틀린 ${S.retryCount}문제 다시 풀기</button>`:''}`
      : `<button class="btn pri" data-act="submit">${objTotal?'제출하고 채점':'제출'}</button>`}
  </div></div>`;
  updateProgress();
  if(!S.submitted){ const c = document.getElementById('clock'); let warned = false, n = 0;
    tick = setInterval(()=>{ const el = (Date.now()-S.t0)/1000;
      if(S.mode === 'exam'){ const left = S.limit - el; c.textContent = (left < 0 ? '+' : '남은 ') + fmtTime(Math.abs(left)); c.style.color = left < 300 ? 'var(--seal)' : '';
        if(left <= 0 && !warned){ warned = true; toast('⏰ 시험 시간이 끝났어요. 마무리하고 제출하세요.', 6000); }
        if(++n % 30 === 0) persist(); }
      else c.textContent = fmtTime(el); }, 1000); }
  else document.getElementById('clock').textContent = fmtTime(S.result.dur);
  wireTest();
}
function updateProgress(){
  const p = document.getElementById('prog'); if(!p) return;
  const obj = S.entries.filter(e=>e.obj), done = obj.filter(e => S.ans[e.item.id] != null && S.ans[e.item.id] !== '').length;
  const sub = S.entries.filter(e=>!e.obj), sdone = sub.filter(e => S.sub[e.item.id]?.text || S.sub[e.item.id]?.transcript).length;
  p.textContent = S.submitted ? (S.result.t ? `정답 ${S.result.c} / ${S.result.t}` : '제출 완료') : [obj.length?`객관식 ${done}/${obj.length}`:'', sub.length?`쓰기·말하기 ${sdone}/${sub.length}`:''].filter(Boolean).join(' · ');
}

function partHTML(part){
  const has = part.groups ? part.groups.some(g => g.items.some(inScope)) : part.items.some(inScope);
  if(!has) return '';
  let body = '';
  if(part.type === 'bank') body += `<div class="bank zh">${Object.entries(part.bank).map(([k,v])=>`<span><b>${k}</b>${esc(v)}</span>`).join('')}</div>${part.example?`<div class="muted zh" style="font-size:calc(var(--zh)*.85)">例如：${esc(part.example)}</div>`:''}`;
  if(part.groups) body += part.groups.filter(g => g.items.some(inScope)).map(g => groupHTML(part, g)).join('');
  else body += part.items.filter(inScope).map(it => qHTML(part, null, it)).join('');
  return `<div class="part"><h3>${esc(part.title)}</h3><div class="ins">${esc(part.ko)}</div>${body}</div>`;
}
function audioTag(setId, id){ return `<audio controls preload="none" src="audio/${setId}/${id}.mp3"></audio>`; }
function markPassage(text, group){
  // replace (R1) markers with live blanks
  return esc(text).replace(/（(\w\d+)）/g, (m, id) => {
    const a = S.ans[id];
    const shown = a ? (group?.bank ? a : a) : '';
    return `<span class="blank" data-blank="${id}">${itemNo(id)}${shown?' · '+esc(shown):''}</span>`;
  });
}
function groupHTML(part, g){
  let head = '';
  if(part.type === 'lgroup'){
    head = audioTag(S.set.id, g.id);
    if(S.submitted || tOK()) head += `<details><summary>녹음 스크립트</summary><div class="script zh">${esc(g.script)}</div></details>`;
  } else if(part.type === 'sentfill'){
    head = `<div class="passage zh">${markPassage(g.passage, g)}</div><div class="bank zh">${Object.entries(g.bank).map(([k,v])=>`<span><b>${k}</b>${esc(v)}</span>`).join('')}</div>`;
  } else {
    head = `<div class="passage zh">${part.type==='cloze'?markPassage(g.passage,g):esc(g.passage)}</div>`;
  }
  return `<div class="grp">${head}${g.items.filter(inScope).map(it => qHTML(part, g, it)).join('')}</div>`;
}
function qHTML(part, g, it){
  let top = '';
  if(part.type === 'tf' || part.type === 'lmc'){
    top = audioTag(S.set.id, it.id);
  }
  const ent = S.entries.find(e => e.item === it);
  const mark = S.submitted && ent && ent.obj ? (isCorrect(ent, S.ans[it.id]) ? ' right' : ' wrong') : '';
  return `<div class="q${mark}" id="q-${it.id}" data-q="${it.id}">${top}<div class="qbody">${qBody(part, g, it)}</div></div>`;
}
function optBtn(id, val, label, txt){
  const a = S.ans[id];
  let cls = a === val ? 'sel' : '';
  if(S.submitted){ const e = S.entries.find(x => x.item.id === id); cls = val === e.item.ans ? 'ok' : (a === val ? 'bad' : ''); }
  return `<button class="opt ${cls}" data-act="pick" data-id="${id}" data-v="${esc(val)}"><b>${esc(label)}</b>${txt!=null?`<span class="zh">${esc(txt)}</span>`:''}</button>`;
}
function qBody(part, g, it){
  const t = part.type, id = it.id, n = itemNo(id);

  } else if(t === 'cloze'){

    h += `<div><span class="qn">${n}</span><span class="zh">${esc(it.text)}</span></div><div class="opts wide">${it.opts.map((o,i)=>optBtn(id,LETTERS[i],LETTERS[i],o)).join('')}</div>`;

// LCS-based character match for repeat / read
function lcsDiff(target, said){
  const a = hanzi(target), b = hanzi(said);
  const m = a.length, n = b.length, dp = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const hit = new Array(m).fill(false); let i=0, j=0;
  while(i<m && j<n){ if(a[i]===b[j]){ hit[i]=true; i++; j++; } else if(dp[i+1][j] >= dp[i][j+1]) i++; else j++; }
  const score = m ? Math.round(dp[0][0] / Math.max(m, n*0.9) * 100) : 0;
  let k = 0;
  const html = [...target].map(ch => /[㐀-鿿]/.test(ch) ? `<span class="${hit[k++]?'m':'x'}">${esc(ch)}</span>` : esc(ch)).join('');
  return {score: Math.min(100, score), html, missed: a.split('').filter((c,idx)=>!hit[idx]).join('')};
}

const recState = {};
async function toggleRec(id){
  const e = S.entries.find(x => x.item.id === id), it = e.item, btn = document.querySelector(`[data-act=rec][data-id="${id}"]`);
  const rs = recState[id];
  if(rs && rs.on){ stopRec(id); return; }
  const st = S.sub[id] = S.sub[id] || {};
  const state = recState[id] = {on:true, final:'', interim:'', t0:Date.now(), chunks:[]};
  btn.classList.add('on'); btn.textContent = '■ 녹음 끝내기';
  const live = document.getElementById('live-'+id); live.textContent = '듣고 있어요…';
  // audio recording for self-review
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    state.stream = stream;
    if(window.MediaRecorder){ state.mr = new MediaRecorder(stream); state.mr.ondataavailable = ev => state.chunks.push(ev.data); state.mr.start(); }
  }catch(err){ toast('마이크 권한을 허용해 주세요.'); }
  if(ASR){
    const r = state.rec = new ASR(); r.lang = 'zh-CN'; r.continuous = true; r.interimResults = true;
    r.onresult = ev => { let fin='', inter=''; for(let i=0;i<ev.results.length;i++){ const t=ev.results[i][0].transcript; if(ev.results[i].isFinal) fin+=t; else inter+=t; } state.cur = fin; state.interim = inter; live.textContent = state.final + fin + inter; };
    r.onend = () => { state.final += state.cur || ''; state.cur = ''; if(state.on){ try{ r.start(); }catch(e){} } };
    r.onerror = ev => { if(ev.error==='not-allowed') toast('마이크 권한이 필요합니다.'); };
    try{ r.start(); }catch(err){}
  }
  const limit = it.sec || (e.part.type==='repeat'||e.part.type==='read' ? 30 : 120);
  state.timer = setInterval(()=>{ const s=(Date.now()-state.t0)/1000; const el=document.getElementById('rt-'+id); if(el) el.textContent = `${fmtTime(s)} / ${fmtTime(limit)}`; if(s>=limit) stopRec(id); }, 250);
}
function stopRec(id){
  const state = recState[id]; if(!state || !state.on) return;
  state.on = false; clearInterval(state.timer);
  const finish = () => {
    const e = S.entries.find(x => x.item.id === id), st = S.sub[id] = S.sub[id] || {};
    const said = (state.final + (state.cur||'') + (state.interim||'')).trim();
    st.transcript = said; st.dur = (Date.now()-state.t0)/1000; delete st.text;
    if(e.part.type === 'repeat' || e.part.type === 'read') scoreRepeat(e, said);
    saveDraft();
    rerenderItem(id);
    if(state.blobURL){ const m = document.getElementById('mine-'+id); if(m){ m.src = state.blobURL; m.hidden = false; } }
  };
  try{ state.rec && state.rec.stop(); }catch(e){}
  if(state.mr && state.mr.state !== 'inactive'){
    state.mr.onstop = () => { state.blobURL = URL.createObjectURL(new Blob(state.chunks, {type: state.mr.mimeType || 'audio/webm'})); state.stream.getTracks().forEach(t=>t.stop()); setTimeout(finish, 350); };
    state.mr.stop();
  } else { state.stream && state.stream.getTracks().forEach(t=>t.stop()); setTimeout(finish, 350); }
}

function scoreRepeat(e, said){
  const st = S.sub[e.item.id] = S.sub[e.item.id] || {};
  const d = lcsDiff(e.item.text, said);
  st.score = d.score; st.diffHTML = `<div class="diff">${d.html}</div><div class="muted" style="font-size:13px;margin-top:4px">인식: ${esc(said||'(인식되지 않음)')}</div>`;
  st.fbHTML = `<div class="ai"><div style="display:flex;gap:12px;align-items:center"><div class="score-big">${d.score}</div><div>정확도 점수<br><span class="muted" style="font-size:13px">${d.score>=90?'아주 좋아요! 很好！':d.score>=70?'좋아요. 빨간 글자를 다시 연습해 보세요.':'모범 녹음을 다시 듣고 천천히 따라 해 보세요.'}</span></div></div>${d.missed?`<div style="margin-top:6px">놓친 글자: <span class="zh" style="color:var(--seal)">${esc(d.missed)}</span></div>`:''}<div class="muted" style="font-size:12px;margin-top:6px">※ 음성 인식 결과를 원문과 비교한 점수입니다. 성조·발음이 정확할수록 인식이 잘 됩니다.</div></div>`;
  logSub(e, said, {score:d.score});
}

// local (offline) feedback
function bigramCover(text, ref){
  const r = hanzi(ref), t = hanzi(text); if(!r.length) return 0;
  const grams = new Set(); for(let i=0;i<r.length-1;i++) grams.add(r.slice(i,i+2));
  const tg = new Set(); for(let i=0;i<t.length-1;i++) tg.add(t.slice(i,i+2));
  let hit = 0; grams.forEach(g => { if(tg.has(g)) hit++; });
  return Math.round(hit / grams.size * 100);
}
function localFeedback(e, text){
  const it = e.item, t = e.part.type, len = countChars(text), notes = [];
  let score = null;
  if(t === 'picture'){
    notes.push(text.includes(it.word) ? `✅ 제시어 <b class="zh">${esc(it.word)}</b>를 사용했어요.` : `❌ 제시어 <b class="zh">${esc(it.word)}</b>가 문장에 없어요.`);
    notes.push(len >= 6 ? `✅ 길이 ${len}자` : `⚠️ ${len}자 — 주어와 서술어를 갖춘 완전한 문장으로 써 보세요.`);
    notes.push(/[。！？!?]$/.test(text.trim()) ? '✅ 문장부호로 끝났어요.' : '⚠️ 문장 끝에 。를 붙이세요.');
  }
  if(t === 'essay' || t === 'summary'){
    notes.push(len < it.min ? `⚠️ ${len}자 — 최소 ${it.min}자 이상 써 보세요.` : len > it.max ? `⚠️ ${len}자 — ${it.max}자 이내로 줄여 보세요.` : `✅ 분량 ${len}자 (권장 ${it.min}~${it.max})`);
    if(it.words){ const miss = it.words.filter(w => !text.includes(w)); notes.push(miss.length ? `❌ 빠진 제시어: <span class="zh">${esc(miss.join('、'))}</span>` : '✅ 제시어를 모두 사용했어요.'); }
    if(t === 'summary'){
      const first = text.trim().split('\n')[0] || '';
      notes.push(first && first.length <= 15 && !/[。，]/.test(first) ? `✅ 제목: <span class="zh">${esc(first)}</span>` : '⚠️ 첫 줄에 짧은 제목을 쓰세요.');
      const cov = bigramCover(text, it.sample + it.text); notes.push(`📌 원문 핵심 표현 포함도(참고): ${cov}%`);
    }
  }
  if(t === 'speak' || t === 'retell'){
    const st = S.sub[it.id] || {};
    notes.push(`🗣 인식된 글자 수 ${len}자${st.dur?` · ${Math.round(st.dur)}초 · 분당 ${Math.round(len/Math.max(1,st.dur)*60)}자`:''}`);
    if(t === 'retell') notes.push(`📌 원문 내용 포함도(참고): ${bigramCover(text, it.script)}%`);
    else notes.push(len < (it.sec||60)*1.2 ? '⚠️ 조금 더 길게, 이유와 예시를 덧붙여 말해 보세요.' : '✅ 충분한 분량으로 말했어요.');
  }
  return {score, notes};
}
function fbHTML(e, local, ai){

    h += `<div style="display:flex;gap:12px;align-items:center"><div class="score-big">${esc(ai.score ?? '-')}</div><div><b>AI 피드백</b><br><span class="muted" style="font-size:13px">${esc(ai.level || '')}</span></div></div>`;

    if(ai.improved) h += `<h4>다듬은 예시</h4><div class="passage zh" style="margin:0">${esc(ai.improved)}</div>`;
    if(ai.tips?.length) h += `<h4>다음 연습</h4><ul>${ai.tips.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
    h += `<h4>기본 점검</h4>`;
  } else {
    h += `<b>기본 점검</b>`;
  }
  h += `<ul>${local.notes.map(n=>`<li>${n}</li>`).join('')}</ul>`;
  if(it.sample) h += `<details><summary>모범 답안</summary><div class="passage zh" style="margin-top:6px">${esc(it.sample)}</div>${(e.part.type==='speak'||e.part.type==='retell')?audioTag(S.set.id, it.id+'_sample'):''}</details>`;
  if(!ai) h += `<div class="muted" style="font-size:12px;margin-top:6px">${CFG.SCRIPT_URL?'AI 상세 피드백을 받지 못해 기본 점검만 표시합니다.':'구글시트·AI가 연결되면 문법 교정과 다듬은 예시도 함께 받을 수 있어요.'}</div>`;
  return h + '</div>';
}
async function requestFeedback(id){
  const e = S.entries.find(x => x.item.id === id), it = e.item, st = S.sub[id] = S.sub[id] || {};
  const text = (st.text ?? st.transcript ?? '').trim();
  if(!text){ toast('먼저 답안을 쓰거나 말해 주세요.'); return; }
  if(e.part.type === 'repeat' || e.part.type === 'read'){ st.transcript = text; scoreRepeat(e, text); saveDraft(); rerenderItem(id); return; }
  const box = document.getElementById('fb-'+id); box.innerHTML = '<div class="ai muted">피드백을 만드는 중… 🧠</div>';
  const local = localFeedback(e, text); let ai = null;
  try{
    const r = await logSub(e, text, {ai:true});
    if(r && r.ok && r.feedback) ai = r.feedback;
  }catch(err){}

}
function logSub(e, text, extra={}){

function rerenderItem(id){

async function submit(){
  const obj = S.entries.filter(e => e.obj);
  const blank = obj.filter(e => S.ans[e.item.id] == null || S.ans[e.item.id] === '').length;
  if(blank && !confirm(`답하지 않은 문항이 ${blank}개 있어요. 제출할까요?`)) return;
  const per = {}; let c = 0;
  const rows = [];
  for(const e of obj){
    const ok = isCorrect(e, S.ans[e.item.id]); if(ok) c++;
    const k = e.sec.key; per[k] = per[k] || {c:0,t:0}; per[k].t++; if(ok) per[k].c++;
    rows.push({id:e.item.id, sec:k, part:e.part.type, resp:S.ans[e.item.id] ?? '', key: Array.isArray(e.item.ans)?e.item.ans[0]:e.item.ans, ok});
  }
  for(const e of S.entries.filter(x => !x.obj)){
    const st = S.sub[e.item.id] || {}; const txt = st.text ?? st.transcript ?? '';
    if(txt) rows.push({id:e.item.id, sec:e.sec.key, part:e.part.type, resp:txt, key:'', ok:null, score: st.score ?? st.aiScore ?? ''});
  }
  const dur = (Date.now() - S.t0)/1000;
  S.submitted = true; S.result = {c, t:obj.length, per, dur}; S.tab = S.entries[0]?.sec.key;
  // wrong-answer bookkeeping
  const wk = wrongKey(S.user.sid, S.set.id); const wrong = new Set(LS.get(wk, []));
  for(const r of rows) if(r.ok === true) wrong.delete(r.id); else if(r.ok === false) wrong.add(r.id);
  LS.set(wk, [...wrong]); S.retryCount = wrong.size;
  recordNotebook(S.set.id, rows);
  const hist = LS.get(histKey(S.user.sid), []); hist.push({set:S.set.id, mode:S.mode==='exam'?'exam':S.scope==='retry'?'retry':'test', scope:S.scope, c, t:obj.length, at:Date.now()}); LS.set(histKey(S.user.sid), hist.slice(-100));
  if(S.mode === 'exam'){ LS.set(progKey(S.user.sid, S.set.id), null); if(CFG.SCRIPT_URL && S.user.h) api({action:'clearProgress', name:S.user.name, hash:S.user.h, setId:S.set.id}).catch(()=>{}); }
  render();
  if(CFG.SCRIPT_URL){
    try{
      const r = await api({action:'submit', sid:S.user.sid, name:S.user.name, setId:S.set.id, level:S.set.level, mode:S.mode==='exam'?'exam':S.scope==='retry'?'retry':'test', scope:S.scope, score:c, total:obj.length, per, durationSec:Math.round(dur), answers:rows});
      toast(r && r.ok ? '✅ 결과가 구글시트에 기록되었어요.' : '⚠️ 시트 기록 실패 — 결과는 이 기기에 저장됐어요.');
    }catch(err){ toast('⚠️ 네트워크 오류 — 결과는 이 기기에 저장됐어요.'); }
  }
}

function recordNotebook(setId, rows){
  const nb = LS.get(nbKey(S.user.sid), {});

    it.tries++; if(!r.ok){ it.misses++; if(!it.firstResp) it.firstResp = String(r.resp); }

  LS.set(nbKey(S.user.sid), nb);
}

// ── 공통: 문제를 읽기 전용으로 그리기 (오답노트·재강의) ──
function staticQ(e, resp, o={}){
  const it = e.item, t = e.part.type, g = e.group, setId = o.setId, reveal = o.reveal !== false, dist = o.dist, n = o.n || 0;
  const bar = k => dist ? (()=>{ const c = dist[k]||0, p = n?Math.round(c/n*100):0; return `<span class="dist"><i style="width:${p}%"></i></span><span class="mono muted" style="font-size:12px;min-width:5em;text-align:right">${c}명 ${p}%</span>`; })() : '';
  let h = '';
  if(o.audio && (t==='tf'||t==='lmc')) h += audioSrcTag(setId, it.id);
  if(o.audio && t==='lgroup') h += audioSrcTag(setId, g.id);
  if(g && g.passage) h += `<div class="passage zh">${esc(g.passage).replace(/（(\w\d+)）/g,(m,id)=>`<span class="blank" ${id===it.id?'style="background:var(--warn-soft)"':''}>${itemNo(id)}</span>`)}</div>`;
  const bank = (g && g.bank) || e.part.bank;
  if(it.passage) h += `<div class="passage zh">${esc(it.passage)}</div>`;
  if(t==='tf') h += `<div class="zh">★ ${esc(it.stem)}</div>`;
  if(it.q) h += `<div class="zh">${esc(it.q)}</div>`;
  if(it.text) h += `<div class="zh" style="white-space:pre-line">${esc(it.text)}</div>`;
  const row = (k, txt) => { const ok = reveal && k===it.ans, bad = resp===k && k!==it.ans;
    return `<div class="srow ${ok?'ok':''} ${bad?'bad':''}"><b>${esc(k)}</b><span class="zh">${esc(txt??'')}</span>${bad?'<span class="chip seal">내 답</span>':''}${ok?'<span class="chip">정답</span>':''}${bar(k)}</div>`; };
  if(it.opts) h += it.opts.map((x,i)=>row(LETTERS[i], x)).join('');
  else if(t==='tf') h += row('√','')+row('×','');
  else if(bank && (t==='bank'||t==='sentfill')) h += Object.entries(bank).map(([k,v])=>row(k,v)).join('');
  else if(t==='order'){ h += it.segs.map((x,i)=>`<div class="srow"><b>${LETTERS[i]}</b><span class="zh">${esc(x)}</span></div>`).join('');
    h += `<div class="fbk">${resp?`내 답 <b class="mono">${esc(resp.split('').join('→'))}</b> · `:''}${reveal?`정답 <b class="mono">${it.ans.split('').join('→')}</b> <span class="zh" style="font-size:inherit">${esc(it.ans.split('').map(L=>it.segs[LETTERS.indexOf(L)]).join('，'))}。</span>`:''}</div>`;
    if(dist) h += topDist(dist, n); }
  else if(t==='arrange'){ h += `<div class="muted">${it.words.map(w=>`<span class="chip" style="background:var(--paper);color:var(--ink)">${esc(w)}</span>`).join(' ')}</div>`;
    h += `<div class="fbk">${resp?`내 답 <span class="zh" style="font-size:inherit;color:var(--seal)">${esc(resp)}</span><br>`:''}${reveal?`정답 <span class="zh" style="font-size:inherit;color:var(--ok)">${esc(it.ans[0])}</span>`:''}</div>`;
    if(dist) h += topDist(dist, n); }
  if(reveal && it.exp) h += `<div class="fbk">💡 ${esc(it.exp)}</div>`;
  const scr = it.script || (g && g.script);
  if(scr) h += `<details ${o.scriptOpen?'open':''}><summary>녹음 스크립트</summary><div class="script zh">${esc(scr)}</div></details>`;
  return h;
}
function topDist(dist, n){ return `<div class="muted" style="font-size:13px;margin-top:6px">학생 응답: ${Object.entries(dist).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,c])=>`<span class="zh" style="font-size:inherit">${esc(k)}</span> ${c}명`).join(' · ')}</div>`; }
function ctxOf(e){ const it = e.item, g = e.group; return [g?.passage || g?.script || it.passage || it.script || '', (g?.bank||e.part.bank) ? '보기: ' + Object.entries(g?.bank||e.part.bank).map(([k,v])=>k+' '+v).join(' / ') : ''].filter(Boolean).join('\n'); }
function qOf(e){ const it = e.item, t = e.part.type; return it.q || (it.stem ? '★ '+it.stem+' (√/× 판단)' : '') || it.text || (it.segs ? '순서 배열: '+it.segs.map((x,i)=>LETTERS[i]+' '+x).join(' / ') : '') || (t==='error'?'어법상 틀린 문장을 고르시오':'') || (t==='cloze'?`빈칸 ${itemNo(it.id)}에 알맞은 것`:'') || (t==='sentfill'?`빈칸 ${itemNo(it.id)}에 알맞은 문장`:'') || (t==='arrange'?'단어 배열: '+it.words.join(' / '):''); }
async function explainAny(setId, id, mine, boxId){
  const key = `hsk_exp_${setId}_${id}`, box = document.getElementById(boxId); const cached = LS.get(key, null);
  const show = txt => { if(box) box.innerHTML = `<div class="ai" style="margin-top:6px;white-space:pre-wrap">💡 ${esc(txt)}</div>`; };
  if(cached) return show(cached);
  if(!CFG.SCRIPT_URL){ if(box) box.innerHTML = '<div class="muted" style="font-size:13px">구글시트 연결 후 AI 해설을 쓸 수 있어요.</div>'; return; }
  const e = entryOf(setId, id); if(box) box.innerHTML = '<div class="muted">해설을 만드는 중…</div>';
  try{ const r = await api({action:'explain', level:getSet(setId).level, context:ctxOf(e), question:qOf(e), opts:e.item.opts||[], answer:correctText(e), mine:mine||''});
    if(r && r.ok && r.explanation){ LS.set(key, r.explanation); show(r.explanation); } else if(box) box.innerHTML = '<div class="muted" style="font-size:13px">AI 해설을 쓸 수 없어요 (GEMINI_API_KEY 필요).</div>'; }

}

      <button class="btn" data-act="lecnav" data-v="1" ${L.i<L.list.length-1?'':'disabled'}>다음 →</button>
    </div>
    <div class="muted" style="text-align:center;font-size:12px">키보드: ← → 이동 · D 분포 · A 정답 · S 스크립트</div>
  </div>`;
}
document.addEventListener('keydown', ev => {
  if(S.view !== 'lecture' || ev.target.closest('input,textarea,select')) return;
  const k = ev.key.toLowerCase();
  if(k==='arrowright' && S.lec.i < S.lec.list.length-1){ S.lec.i++; S.lec.show={}; render(); }
  else if(k==='arrowleft' && S.lec.i > 0){ S.lec.i--; S.lec.show={}; render(); }
  else if({d:'dist',a:'ans',s:'script'}[k]){ const f={d:'dist',a:'ans',s:'script'}[k]; S.lec.show[f]=!S.lec.show[f]; render(); }
});
async function endLecture(){
  document.body.dataset.size = S.prevSize || 'm';
  const done = S.lec.list;
  S.view = 'teacher'; S.ttab = 'review'; render();
  if(done.length){  // 재강의를 끝내면 자동으로 ‘재강의함’ 표시 → 학생 오답노트에 🎓
    const c = {...(S.cfg||{})}; c.reviewed = {...(c.reviewed||{})};
    for(const x of done){ const a = new Set(c.reviewed[x.set]||[]); a.add(x.id); c.reviewed[x.set] = [...a]; }
    await saveConfig(c);
    toast(`🎓 ${done.length}문제를 ‘재강의함’으로 표시했어요. 학생 오답노트에 반영됩니다.`, 4000);
  }
}

// ── events ──
function wireTest(){ /* events are delegated on document */ }
document.addEventListener('input', ev => {
  const ta = ev.target.closest && ev.target.closest('textarea[data-text]'); if(!ta || !S.sub) return;
  const id = ta.dataset.text, st = S.sub[id] = S.sub[id] || {}; st.text = ta.value;
  const c = document.getElementById('cnt-'+id); if(c) c.textContent = countChars(ta.value) + '자';
  saveDraft(); updateProgress(); persist();
});
// only one audio at a time
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') persist(true); });
window.addEventListener('pagehide', () => persist(true));
document.addEventListener('play', ev => { if(ev.target.tagName === 'AUDIO') document.querySelectorAll('audio').forEach(b => { if(b !== ev.target) b.pause(); }); }, true);
function startSummary(id){
  const e = S.entries.find(x=>x.item.id===id), st = S.sub[id] = S.sub[id] || {};
  st.phase = 'read'; st.readEnd = Date.now() + e.item.read*1000; rerenderItem(id);
  const iv = setInterval(() => {
    const el = document.getElementById('sumclock-'+id), left = Math.max(0, (st.readEnd - Date.now())/1000);
    if(el) el.textContent = fmtTime(left);
    if(left <= 0 || st.phase !== 'read'){ clearInterval(iv); if(st.phase === 'read'){ st.phase='write'; rerenderItem(id); toast('읽기 시간이 끝났어요. 이제 요약해 쓰세요.'); } }
  }, 500);
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if(!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  if(act === 'font'){ const order=['m','l','xl']; const cur=document.body.dataset.size||'m'; document.body.dataset.size = order[(order.indexOf(cur)+1)%3]; LS.set('hsk_font', document.body.dataset.size); }
  else if(act === 'logout'){ if(S.view==='test') persist(true); S.user = null; LS.set('hsk_user', null); S.view='login'; render(); }
  else if(act === 'level'){ S.level = +v; LS.set('hsk_level', S.level); render(); }
  else if(act === 'pinok'){
    const pin = document.getElementById('gpin').value.trim();
    apiGet({action:'review', pin, sets:''}).then(r => {
      if(r && r.ok){ sessionStorage.setItem('hsk_pin_ok','1'); sessionStorage.setItem('hsk_pin', pin); toast('✅ 교사 모드가 켜졌어요.'); render(); }
      else toast(r?.error || 'PIN이 맞지 않습니다.'); }).catch(() => toast('네트워크 오류'));
  }
  else if(act === 'golevel'){ LS.set(`hsk_go_${S.user.sid}_${v}`, true); S.level = +v; LS.set('hsk_level', S.level); render(); }
  else if(act === 'stay'){ LS.set(`hsk_stay_${S.user.sid}_${v}`, true); render(); toast(`${v}급 복습을 계속합니다. 준비되면 '${+v+1}급 도전하기'를 누르세요.`); }
  else if(act === 'start'){ startTest(b.dataset.set, b.dataset.scope); }
  else if(act === 'home'){ if(S.view==='test' && !S.submitted && S.mode!=='exam' && !confirm('나가면 객관식 답은 저장되지 않아요. 나갈까요?')) return; S.view='home'; render(); syncWrong(); }
  else if(act === 'teacher'){ S.view='teacher'; render(); }
  else if(act === 'tload'){ loadTeacher(); }
  else if(act === 'tab'){ S.tab = v; persist(); app.querySelectorAll('section[data-sec]').forEach(s => s.hidden = s.dataset.sec !== v); app.querySelectorAll('[data-act=tab]').forEach(t => t.setAttribute('aria-selected', t.dataset.v===v)); window.scrollTo(0,0); }
  else if(S.submitted && ['pick','seq','word','reset','wreset','sumstart'].includes(act)){ return; }
  else if(act === 'pick'){ S.ans[id] = v; rerenderItem(id); persist(); }
  else if(act === 'seq'){ S.ans[id] = (S.ans[id]||'') + v; rerenderItem(id); persist(); }
  else if(act === 'reset'){ S.ans[id] = ''; rerenderItem(id); persist(); }
  else if(act === 'word'){ const arr = S.ans['_w_'+id] = S.ans['_w_'+id] || []; arr.push(+v); const it = S.entries.find(x=>x.item.id===id).item; S.ans[id] = arr.map(i=>it.words[i]).join(''); rerenderItem(id); persist(); }
  else if(act === 'wreset'){ S.ans['_w_'+id] = []; S.ans[id] = ''; rerenderItem(id); persist(); }
  else if(act === 'saveexit'){ persist(true); toast('저장했어요. 다음에 ‘이어서 풀기’로 계속하세요.'); S.view='home'; render(); }
  else if(act === 'exam'){ startTest(b.dataset.set, 'exam', v === 'resume'); }
  else if(act === 'corner'){ S.corner = v; LS.set('hsk_corner', v); render(); }
  else if(act === 'explain'){ explain(id); }
  else if(act === 'notebook'){ openNotebook(v ? +v : S.level); }
  else if(act === 'nblevel'){ S.nb.level = +v; S.nb.set = 'all'; render(); }
  else if(act === 'nbstatus'){ S.nb.status = v; render(); }
  else if(act === 'nbexplain'){ explainAny(b.dataset.set, id, v, `nbexp-${b.dataset.set}-${id}`); }
  else if(act === 'print'){ document.querySelectorAll('details').forEach(d => d.open = true); window.print(); }
  else if(act === 'ttab'){ S.ttab = v; render(); }
  else if(act === 'rvlevel'){ S.rv = {level:+v, sets:null, items:null, sel:new Set()}; render(); }
  else if(act === 'rvset'){ const lv = SETS.filter(x=>x.level===S.rv.level); const cur = new Set(S.rv.sets || lv.filter(x=>x.corner==='exam').map(x=>x.id)); b.checked ? cur.add(v) : cur.delete(v); S.rv.sets = [...cur]; S.rv.items = null; }
  else if(act === 'rvload'){ loadReview(); }
  else if(act === 'rvsel'){ b.checked ? S.rv.sel.add(v) : S.rv.sel.delete(v); const st = document.querySelector('[data-act=rvstart]'); if(st){ st.disabled = !S.rv.sel.size; st.textContent = `▶ 선택한 ${S.rv.sel.size}문제로 재강의`; } }
  else if(act === 'rvauto'){ S.rv.sel = new Set(S.rv.items.filter(x => x.n && x.wrong/x.n >= 0.4 && entryOf(x.set,x.id)?.obj).map(x => x.set+'|'+x.id)); render(); }
  else if(act === 'rvnone'){ S.rv.sel = new Set(); render(); }
  else if(act === 'rvstart'){ startLecture(); }
  else if(act === 'lecnav'){ S.lec.i += +v; S.lec.show = {}; render(); }
  else if(act === 'lecshow'){ S.lec.show[v] = !S.lec.show[v]; render(); }
  else if(act === 'lecexplain'){ const x = S.lec.list[S.lec.i]; explainAny(x.set, x.id, '', 'lecexp'); }
  else if(act === 'lecexit'){ endLecture(); }
  else if(act === 'plsave'){ savePlan(); }
  else if(act === 'submit'){ submit(); }
  else if(act === 'retrynow'){ startTest(S.set.id, 'retry'); }
  else if(act === 'rec'){ toggleRec(id); }
  else if(act === 'feedback'){ requestFeedback(id); }
  else if(act === 'sumstart'){ startSummary(id); }
  else if(act === 'sumwrite'){ const st=S.sub[id]; if(st){ st.phase='write'; rerenderItem(id); } }
});
document.body.dataset.size = LS.get('hsk_font', 'm');
if(S.user && !S.user.h) S.user = null;   // older sessions: ask for name + password once
S.cfg = LS.get('hsk_cfg', {});
if(S.user){ S.view = 'home'; syncWrong(); syncProgress(); }
render(); loadConfig();
</script>
</body>
</html>
